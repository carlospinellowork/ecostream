# Configuração do analisador estático do EcoStream.
#
# Política: conjunto de regras rico para orientar o dia a dia no editor, mas o CI roda
# `flutter analyze --no-fatal-infos` — infos orientam, warnings e errors bloqueiam.
# Escalar uma regra de estilo para `error` aqui derruba o build do APK; só faça isso
# depois de rodar `dart format` e `flutter analyze` limpos localmente. Ver CLAUDE.md §5.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'

  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    # APIs depreciadas do Flutter mudam a cada release; migramos de forma incremental
    # sem travar o build de quem está no meio de uma feature.
    deprecated_member_use: info
    deprecated_member_use_from_same_package: info
    todo: ignore

linter:
  rules:
    # --- Correção ---
    always_declare_return_types: true
    avoid_empty_else: true
    avoid_slow_async_io: true
    avoid_type_to_string: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true
    # Usar BuildContext depois de await é a causa nº 1 de crash em fluxo de auth.
    use_build_context_synchronously: true

    # --- Dinheiro e logs ---
    # print() não sobrevive a release; use AppLogger.
    avoid_print: true

    # --- Estilo (ver CLAUDE.md §5) ---
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    directives_ordering: true
    sort_child_properties_last: true
    unnecessary_parenthesis: true
    unnecessary_to_list_in_spreads: true
    use_named_constants: true
    use_string_buffers: true

    # --- Imutabilidade / API ---
    # prefer_initializing_formals fica desligada: ela sugere `this._campo` para
    # construtores que atribuem um parametro nomeado a um campo privado, mas
    # parametro nomeado nao pode comecar com underscore em Dart. A sugestao e
    # inaplicavel nos repositorios e controllers deste projeto.
    prefer_initializing_formals: false
    avoid_field_initializers_in_const_classes: true
    prefer_const_declarations: true
    use_setters_to_change_properties: true
